<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de QR Code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .container {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #qrcode {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }
  </style>
  <!-- Biblioteca QRCode.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div class="container">
    <h2>Gerar QR Code</h2>
    <input type="url" id="linkInput" placeholder="Cole seu link aqui (ex: https://...)" required>
    <button onclick="gerarQRCode()">Gerar</button>

    <div id="qrcode"></div>
  </div>

  <script>
    let qrInstancia = null;

    function gerarQRCode() {
      const link = document.getElementById("linkInput").value.trim();
      const qrContainer = document.getElementById("qrcode");

      if (!link) {
        alert("Por favor, insira um link válido.");
        return;
      }

      // Limpa QR Code anterior se existir
      qrContainer.innerHTML = "";

      // Cria o novo QR Code
      qrInstancia = new QRCode(qrContainer, {
        text: link,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }
  </script>

</body>
</html>
